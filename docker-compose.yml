name: open-doing

# 本地开发只需要 PostgreSQL；Next.js 在宿主机用 pnpm dev 直接运行
# （编译走原生 APFS，避开 macOS 容器内 Turbopack 编译过慢的问题）。
# 完整流程：docker compose up -d --wait → pnpm db:migrate → pnpm dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: open-doing
      POSTGRES_PASSWORD: open-doing
      POSTGRES_DB: open_doing
    ports:
      # 默认 5433，与 apps/web/.env.local 的 DATABASE_URL 一致；5432 常被
      # ssh 隧道 / VSCode Remote 转发占用，故不用 5432。可用 POSTGRES_PORT 覆盖。
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open-doing -d open_doing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
