name: open-doing

# 本地开发只需要 MySQL；Next.js 在宿主机用 pnpm dev 直接运行
# （编译走原生 APFS，避开 macOS 容器内 Turbopack 编译过慢的问题）。
# 完整流程：docker compose up -d --wait → pnpm db:migrate → pnpm dev
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: open-doing
      MYSQL_USER: open-doing
      MYSQL_PASSWORD: open-doing
      MYSQL_DATABASE: open_doing
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 默认 3307，与 apps/web/.env.local 的 DATABASE_URL 一致；MySQL 默认的
      # 3306 常被本机已有实例占用，故不用 3306。可用 MYSQL_PORT 覆盖。
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uopen-doing -popen-doing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
