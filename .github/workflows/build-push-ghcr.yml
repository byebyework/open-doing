name: build-push-ghcr

on:
  workflow_dispatch:

env:
  # github.repository = <owner>/<repo>，GHCR 要求全小写，本仓库天然满足
  WEB_IMAGE: ghcr.io/${{ github.repository }}
  NGINX_IMAGE: ghcr.io/${{ github.repository }}-nginx
  NGINX_SRC: nginx:1.27-alpine

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # 构建元数据（关于系统页展示）：提交号取 checkout 的 SHA；
      # 构建时间用上海时区，与页面「构建时间」展示口径一致。
      - name: Record build metadata
        run: echo "BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          # 原 workflow 为兼容 ACR 个人版关掉了 provenance；GHCR 支持 attestation，
          # 这里沿用关闭以保持一致，需要供应链证明时删除本行即可。
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror nginx base image to GHCR
        run: |
          docker pull "$NGINX_SRC"
          docker tag "$NGINX_SRC" "${NGINX_IMAGE}:1.27-alpine"
          docker push "${NGINX_IMAGE}:1.27-alpine"
