# open-doing 香港服务器反代：标准 443。公网流量经 Cloudflare 边缘（Proxied）回源，
# 源站证书为 Cloudflare Origin CA（15 年免续期，仅 CF 信任，浏览器只见 CF 边缘证书），
# 证书文件放宿主机 CERT_DIR（只读挂载为 /etc/nginx/certs）。
# <域名> 为占位符，部署时按 docs/deploy-hk-server.md 替换为真实域名。

server {
    listen 443 ssl;
    server_name <域名> www.<域名>;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
