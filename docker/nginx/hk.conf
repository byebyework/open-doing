# open-doing 香港服务器反代：标准 443（无备案约束，80/443 正常放行）。
# 证书由宿主机 acme.sh（DNS-01，dns_ali——域名 DNS 仍在阿里云，与服务器位置无关）
# 签发，SAN 覆盖裸域与 www 子域，install-cert 到宿主机 CERT_DIR（只读挂载为 /etc/nginx/certs）。
# <域名> 为占位符，部署时按 docs/deploy-hk-server.md 替换为真实域名。

server {
    listen 443 ssl;
    server_name <域名> www.<域名>;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
