name: open-doing-prod

# 生产/准生产部署示例：web 应用 + PostgreSQL 16 单机编排。
#
#   docker compose -f docker-compose.prod.yml up -d --wait
#
# 密钥从仓库根目录的 `.env` 读取（compose 自动加载；不要提交真实值）：
#   POSTGRES_PASSWORD    数据库口令（默认 open-doing，生产务必修改）
#   BETTER_AUTH_SECRET   会话签名密钥（必填；openssl rand -base64 32）
#   CRON_SECRET          cron 路由鉴权密钥（必填）
#   APP_PORT             对外端口（默认 3000）
#
# web 容器启动时会先执行数据库迁移（幂等），详见 Dockerfile 与 docker/entrypoint.sh。

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: open-doing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open-doing}
      POSTGRES_DB: open_doing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open-doing -d open_doing"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://open-doing:${POSTGRES_PASSWORD:-open-doing}@postgres:5432/open_doing
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      # BETTER_AUTH_URL: https://your-domain.example   # 可选；未设置时由请求推断
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
